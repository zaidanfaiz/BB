name: BB Static Security Audit

on:
  pull_request:
    paths:
      - ".github/workflows/bb-static-security.yml"
      - "tools/bb_static_audit.py"
      - "tools/bb_sbom.py"
      - "tools/bb_deep_audit.py"
      - "tools/bb_policy_checks.py"
      - "tools/bb_dex_triage.py"
      - "tools/bb_hek_inventory.py"
      - "tools/bb_elf_runtime.py"
      - "AndroidManifest.xml"
      - "assets/**"
      - "lib/**"
      - "classes*.dex"
      - "res/raw/aboutlibraries.json"
      - "res/xml/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout extracted APK
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install binary AndroidManifest parser
        run: python -m pip install androguard==4.1.3
      - name: Inspect tracked assets (read only)
        run: python tools/bb_static_audit.py
      - name: Review Android components network settings and ELF metadata
        run: python tools/bb_deep_audit.py
      - name: Check permission definitions and network domain syntax
        run: python tools/bb_policy_checks.py
      - name: Inspect all DEX class and method metadata
        run: python tools/bb_dex_triage.py
      - name: Inventory HEK headers across bundled assets
        run: python tools/bb_hek_inventory.py
      - name: Inspect Cocos2d ELF metadata and runtime markers
        run: python tools/bb_elf_runtime.py
      - name: Generate CycloneDX dependency inventory
        run: python tools/bb_sbom.py
      - name: Check declared Maven dependency versions against OSV
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.1 \
            scan source -L /src/audit-output/bb-dependencies.cdx.json \
            --format=json --output-file=/src/audit-output/osv-findings.json
      - name: Publish static audit report and OSV results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-static-security-report
          path: audit-output/
          if-no-files-found: warn
          retention-days: 14
