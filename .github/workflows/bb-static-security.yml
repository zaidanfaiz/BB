name: BB Static Security Audit

on:
  pull_request:
    paths:
      - ".github/workflows/bb-static-security.yml"
      - "tools/bb_static_audit.py"
      - "AndroidManifest.xml"
      - "assets/**"
      - "lib/**"
      - "classes*.dex"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout extracted APK
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install binary AndroidManifest parser
        run: python -m pip install androguard==4.1.3
      - name: Inspect tracked assets (read only)
        run: python tools/bb_static_audit.py
      - name: Publish static audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-static-security-report
          path: audit-output/
          if-no-files-found: warn
          retention-days: 14
