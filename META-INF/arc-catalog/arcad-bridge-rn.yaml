name: arcad-bridge-rn

groupId: com.hs.sdk
artifactId: bridge-rn
version: 5.0.2-PoC-SNAPSHOT

# RN bridge 是上层基础设施，依赖 common
priority: 60

dependsOn:
  - common

# RN bridge SPI（HsBridgeModuleProvider / HsUnifiedReactPackage 是已知例外命名，详见 ADR-S4.1 v1.2 §11.6）
# 本期 module.yaml 仅记录 SPI 接口路径，命名回炉留 X2
serviceProviders:
  - com.hs.sdk.bridge.rn.HsBridgeModuleProvider

placeholders:
  required: []
  optional: []

features:
  - rn
  - bridge
